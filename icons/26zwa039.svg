<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#F0D080"/>
    <stop offset="0.55" stop-color="#C9932F"/>
    <stop offset="1" stop-color="#7A5518"/>
  </linearGradient>
  <radialGradient id="ringDark" cx="0.4" cy="0.35" r="0.75">
    <stop offset="0" stop-color="#4A4A48"/>
    <stop offset="1" stop-color="#141412"/>
  </radialGradient>
  <filter id="ds" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0.4" dy="0.6" stdDeviation="0.7" flood-color="#000000" flood-opacity="0.4"/>
  </filter>
</defs>

<g filter="url(#ds)">

  <!-- ===== Squared body ===== -->
  <rect x="4" y="4" width="24" height="24" rx="3.5" ry="3.5"
        fill="url(#brass)" stroke="#5C3F14" stroke-width="0.8"/>
  <!-- top-left sheen -->
  <rect x="5.2" y="5.2" width="14" height="5" rx="2"
        fill="#FFFFFF" opacity="0.20"/>

  <!-- corner rivets -->
  <circle cx="6.8" cy="6.8" r="1.05" fill="#5C3F14" stroke="#4A3410" stroke-width="0.26"/>
  <circle cx="6.5" cy="6.5" r="0.3" fill="#F0D080"/>
  <circle cx="25.2" cy="6.8" r="1.05" fill="#5C3F14" stroke="#4A3410" stroke-width="0.26"/>
  <circle cx="24.9" cy="6.5" r="0.3" fill="#F0D080"/>
  <circle cx="6.8" cy="25.2" r="1.05" fill="#5C3F14" stroke="#4A3410" stroke-width="0.26"/>
  <circle cx="6.5" cy="24.9" r="0.3" fill="#F0D080"/>
  <circle cx="25.2" cy="25.2" r="1.05" fill="#5C3F14" stroke="#4A3410" stroke-width="0.26"/>
  <circle cx="24.9" cy="24.9" r="0.3" fill="#F0D080"/>

  <!-- ===== Dark center ring (diameter ~1/4 of the square's 24-wide body) ===== -->
  <circle cx="16" cy="16" r="2.4" fill="none" stroke="url(#ringDark)" stroke-width="1.2"/>

</g>
</svg>
