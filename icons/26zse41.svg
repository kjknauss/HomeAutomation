<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#F0D080"/>
    <stop offset="0.55" stop-color="#C9932F"/>
    <stop offset="1" stop-color="#7A5518"/>
  </linearGradient>
  <radialGradient id="ledGreen" cx="0.35" cy="0.35" r="0.75">
    <stop offset="0" stop-color="#E7FFEA"/>
    <stop offset="0.4" stop-color="#5FCB6E"/>
    <stop offset="1" stop-color="#276B31"/>
  </radialGradient>
  <radialGradient id="ledRed" cx="0.35" cy="0.35" r="0.75">
    <stop offset="0" stop-color="#FFE3E0"/>
    <stop offset="0.4" stop-color="#E5695E"/>
    <stop offset="1" stop-color="#8C2A22"/>
  </radialGradient>
  <radialGradient id="ledNeutral" cx="0.35" cy="0.35" r="0.75">
    <stop offset="0" stop-color="#F2F4F6"/>
    <stop offset="0.4" stop-color="#AEB6BD"/>
    <stop offset="1" stop-color="#5B636A"/>
  </radialGradient>
  <filter id="ds" x="-40%" y="-40%" width="180%" height="180%">
    <feDropShadow dx="0.5" dy="0.7" stdDeviation="0.8" flood-color="#000000" flood-opacity="0.4"/>
  </filter>
</defs>

<g filter="url(#ds)">

  <!-- ===== Sensor body (larger piece, mounted on the moving door/window - shown left) ===== -->
  <rect x="4.0" y="1.3" width="10" height="27" rx="2.6" ry="2.6"
        fill="url(#brass)" stroke="#5C3F14" stroke-width="0.7"/>
  <!-- left highlight strip (vertical edge -> solid color, per straight-line gradient rule) -->
  <rect x="4.7" y="2.0" width="1.2" height="25.6" rx="0.6"
        fill="#FFFFFF" opacity="0.32"/>
  <!-- right shadow strip -->
  <rect x="12.2" y="2.0" width="1.1" height="25.6" rx="0.55"
        fill="#000000" opacity="0.16"/>
  <!-- rivet, outer (top) end -->
  <circle cx="9.0" cy="5.1" r="1.15" fill="#5C3F14" stroke="#4A3410" stroke-width="0.32"/>
  <circle cx="8.65" cy="4.75" r="0.35" fill="#F0D080"/>
  <!-- jeweled status LED -->
  <circle cx="9.0" cy="14.5" r="2.2" fill="url(#ledNeutral)" stroke="#123A1A" stroke-width="0.38"/>
  <!-- orientation-mark notch, facing the gap (right side) -->
  <path d="M14.3,20.6 L15.7,22 L14.3,23.4 Z" fill="#5C3F14"/>

  <!-- ===== Magnet (smaller piece, mounted on the fixed frame - shown right) ===== -->
  <rect x="19.0" y="12" width="8" height="16" rx="2.2" ry="2.2"
        fill="url(#brass)" stroke="#5C3F14" stroke-width="0.7"/>
  <rect x="19.6" y="12.7" width="1.05" height="14.6" rx="0.5"
        fill="#FFFFFF" opacity="0.32"/>
  <rect x="25.8" y="12.7" width="0.95" height="14.6" rx="0.47"
        fill="#000000" opacity="0.16"/>
  <!-- orientation-mark notch, facing the gap (left side) -->
  <path d="M19.0,20.6 L17.6,22 L19.0,23.4 Z" fill="#5C3F14"/>
  <!-- rivet, outer (bottom) end -->
  <circle cx="23.0" cy="24.6" r="1.05" fill="#5C3F14" stroke="#4A3410" stroke-width="0.3"/>
  <circle cx="22.65" cy="24.25" r="0.32" fill="#F0D080"/>

</g>
</svg>
